<h1 class="text-center mb-5">Wellcome back --Username--</h1>
<div class="row">
    <div class="col-md mb-4" name="userDetails">
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">First Name:</p>
            <p class="my-2 py-1 fs-5 col">firstName</p>
        </div>
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">Last Name:</p>
            <p class="my-2 py-1 fs-5 col">lastName</p>
        </div>
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">Email:</p>
            <p class="my-2 py-1 fs-5 col">email</p>
        </div>
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">Phone Number:</p>
            <p class="my-2 py-1 fs-5 col">phoneNumber</p>
        </div>
    </div>
    <div class="col-md" name="userAccounts">
        <h2 class="text-center my-2 fs-3">Selected account</h2>
        <select class="form-select my-3" aria-label="Default select example">
            <!--<option selected>Open this select menu</option>-->
            <option *ngFor="let account of accounts" [value]="account">{{account}}</option>
        </select>
        <div class="container d-flex align-items-center justify-content-center">
            <button type="button" class="btn btn-primary my-2">Add new account</button>
        </div>
    </div>
</div>
