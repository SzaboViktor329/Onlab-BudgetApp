<h1 class="text-center mb-5">Wellcome back {{userViewModel.userName}}</h1>
<div class="row">
    <div class="mx-auto mb-4 pb-4 pt-4 rounded" name="userDetails" style="background-color: rgb(23, 148, 210,0.4); width: fit-content; padding-left: 50px; padding-right: 50px;">
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">First Name:</p>
            <p class="my-2 py-1 fs-5 col">{{userViewModel.firstName}}</p>
        </div>
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">Last Name:</p>
            <p class="my-2 py-1 fs-5 col">{{userViewModel.lastName}}</p>
        </div>
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">Email:</p>
            <p class="my-2 py-1 fs-5 col">{{userViewModel.email}}</p>
        </div>
        <div class="row">
            <p class="my-2 py-1 fs-5 fw-bold col-auto">Phone Number:</p>
            <p class="my-2 py-1 fs-5 col">{{userViewModel.phoneNumber}}</p>
        </div>
    </div>
    <div class="rounded mx-auto pb-4 pt-4" name="userAccounts" style="background-color: rgba(174, 174, 174, 0.916); width: fit-content; height: fit-content; padding-left: 100px; padding-right: 100px;">
        <h2 class="text-center my-2 fs-3">Selected account</h2>
        <select class="form-select my-3" aria-label="Default select example" id="selectAccount" (change)="selectChange()" style="background-color: rgba(210, 210, 210, 0.897);">
            <!--<option selected>Open this select menu</option>-->
            <option *ngFor="let account of accounts" [value]="account">{{account.accountNumber}} {{account.accountName}}</option>
        </select>
        <div class="container d-flex align-items-center justify-content-center">
            <button type="button" class="btn btn-primary my-2" data-bs-toggle="modal" data-bs-target="#addAccountModal">Add new account</button>
        </div>
    </div>
</div>

<app-addaccount-modal (addAccount)="addAccount($event)"></app-addaccount-modal>
